name: Build Kairou APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create Android project
        shell: bash
        run: |
          set -e

          if [ ! -f icon.png ]; then
            echo "ERRO: envie icon.png para a raiz do repositorio."
            exit 1
          fi

          mkdir -p app/src/main/java/com/example/kairou

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KairouAndroid"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.kairou"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.example.kairou"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          # Criar icones em diferentes resolucoes
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          convert icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="Kairou"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/kairou/MainActivity.kt <<'EOF'
          package com.example.kairou

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.WebChromeClient
          import android.graphics.Color
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.ProgressBar

          class MainActivity : Activity() {
              private lateinit var web: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = Color.rgb(15, 15, 18)
                  window.navigationBarColor = Color.BLACK

                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)

                  web = WebView(this)
                  web.setBackgroundColor(Color.BLACK)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.mediaPlaybackRequiresUserGesture = true
                  web.webViewClient = WebViewClient()

                  val progress = ProgressBar(
                      this,
                      null,
                      android.R.attr.progressBarStyleHorizontal
                  )
                  progress.max = 100

                  web.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(
                          view: WebView?,
                          newProgress: Int
                      ) {
                          progress.progress = newProgress
                          progress.visibility =
                              if (newProgress >= 100) View.GONE else View.VISIBLE
                      }
                  }

                  root.addView(
                      web,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )

                  root.addView(
                      progress,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          6
                      )
                  )

                  setContentView(root)

                  if (savedInstanceState == null) {
                      web.loadUrl("https://kairou.space/")
                  } else {
                      web.restoreState(savedInstanceState)
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  web.saveState(outState)
                  super.onSaveInstanceState(outState)
              }

              @Deprecated("Deprecated in Android")
              override fun onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {
                  if (::web.isInitialized) {
                      web.destroy()
                  }
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kairou-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
