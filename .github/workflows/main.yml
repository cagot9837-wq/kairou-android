
name: Compilar Kairou APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Preparar projeto
        run: |
          unzip kairou_android_app_source.zip -d .
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        working-directory: kairou_android_app
        run: |
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kairou-apk
          path: kairou_android_app/app/build/outputs/apk/debug/app-debug.apk
          
