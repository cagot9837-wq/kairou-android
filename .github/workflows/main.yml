
name: Kairou Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compilar Kairou
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager --licenses
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar arquivo do projeto
        run: |
          test -f kairou_android_app_source.zip || {
            echo "::error::Coloque kairou_android_app_source.zip na raiz do repositório."
            exit 1
          }
          unzip -t kairou_android_app_source.zip

      - name: Extrair projeto
        run: unzip -o kairou_android_app_source.zip -d .

      - name: Verificar projeto Android
        run: |
          test -f kairou_android_app/settings.gradle.kts
          test -f kairou_android_app/app/build.gradle.kts
          test -f kairou_android_app/app/src/main/AndroidManifest.xml

      - name: Compilar APK
        working-directory: kairou_android_app
        run: gradle assembleDebug --no-daemon

      - name: Verificar APK
        run: |
          test -f kairou_android_app/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p out
          cp kairou_android_app/app/build/outputs/apk/debug/app-debug.apk out/Kairou.apk
          ls -lh out/Kairou.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Kairou-Android
          path: out/Kairou.apk
          retention-days: 14
          
