name: Build Kairou APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Create Android project and icon
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/kairou
          mkdir -p app/src/main/res

          # Gera automaticamente o icone Kairou
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os

          size = 512
          base = Image.new("RGB", (size, size), (7, 8, 13))
          draw = ImageDraw.Draw(base)

          # Fundo escuro com brilho azul discreto
          for r in range(250, 0, -1):
              color = (
                  7,
                  8 + int((250-r) * 0.015),
                  13 + int((250-r) * 0.05)
              )
              draw.ellipse(
                  (256-r, 256-r, 256+r, 256+r),
                  fill=color
              )

          # Letra K geometrica
          draw.polygon(
              [(105, 90), (178, 90), (178, 225),
               (310, 95), (405, 95), (265, 245),
               (410, 420), (310, 420), (205, 290),
               (178, 315), (178, 420), (105, 420)],
              fill=(245, 248, 255)
          )

          # Anel azul ao redor da letra
          ring = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          rd = ImageDraw.Draw(ring)
          rd.ellipse(
              (35, 170, 480, 345),
              outline=(0, 160, 255, 255),
              width=30
          )
          ring = ring.rotate(-24, resample=Image.Resampling.BICUBIC)
          base = base.convert("RGBA")
          base.alpha_composite(ring)

          # Reforca o contraste e salva em varias resolucoes
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, pixels in sizes.items():
              path = f"app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)
              icon = base.resize(
                  (pixels, pixels),
                  Image.Resampling.LANCZOS
              )
              icon.save(f"{path}/ic_launcher.png")

          print("Icone Kairou criado com sucesso.")
          PY

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KairouAndroid"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.kairou"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.example.kairou"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="Kairou"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/kairou/MainActivity.kt <<'EOF'
          package com.example.kairou

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.WebChromeClient
          import android.graphics.Color
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.ProgressBar

          class MainActivity : Activity() {
              private lateinit var web: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = Color.rgb(15, 15, 18)
                  window.navigationBarColor = Color.BLACK

                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)

                  web = WebView(this)
                  web.setBackgroundColor(Color.BLACK)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.mediaPlaybackRequiresUserGesture = true
                  web.webViewClient = WebViewClient()

                  val progress = ProgressBar(
                      this, null,
                      android.R.attr.progressBarStyleHorizontal
                  )
                  progress.max = 100

                  web.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(
                          view: WebView?,
                          newProgress: Int
                      ) {
                          progress.progress = newProgress
                          progress.visibility =
                              if (newProgress >= 100) View.GONE else View.VISIBLE
                      }
                  }

                  root.addView(
                      web,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )

                  root.addView(
                      progress,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 6
                      )
                  )

                  setContentView(root)

                  if (savedInstanceState == null) {
                      web.loadUrl("https://kairou.space/")
                  } else {
                      web.restoreState(savedInstanceState)
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  web.saveState(outState)
                  super.onSaveInstanceState(outState)
              }

              @Deprecated("Deprecated in Android")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack()
                  else super.onBackPressed()
              }

              override fun onDestroy() {
                  if (::web.isInitialized) web.destroy()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kairou-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
